# Builds a .NET framework project in Release mode when a new release is created
# and uploads the build results to the newly created release
# then updates update.xml and Properties/AssemblyInfo.cs
name: Publish release

env:
  projectName: FunkeySelectorGUI
  projectFolder: FunkeySelectorGUI
  solutionFile: FunkeySelectorGUI.sln

on:
  release: 
    types:
      - released

concurrency:
  group: ${{ github.workflow }}
  # wouldn't want a previously running release workflow to push artifacts to the wrong release
  cancel-in-progress: true

jobs:
  publish:
    permissions:
      contents: write
    strategy:
      matrix: # please please please don't put multiple build configurations in here, it will cause unintended behaviour
        configuration: [ Release ]
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: "${{ github.event.repository.default_branch }}"
      
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3
      
      - name: Setup NuGet
        uses: NuGet/setup-nuget@v3

      - name: Restore Packages
        run: nuget restore ${{ env.solutionFile }}

      - name: Install .NET Framework v4.0 reference assemblies
        run: |
          nuget install Microsoft.NETFramework.ReferenceAssemblies -Version 1.0.3
          nuget install Microsoft.NETFramework.ReferenceAssemblies.net40 -Version 1.0.3

          $net40path = "C:\Users\runneradmin\.nuget\packages\microsoft.netframework.referenceassemblies.net40\1.0.3\build\.NETFramework\v4.0"
          $net40dest = "C:\Program Files (x86)\Reference Assemblies\Microsoft\Framework\.NETFramework\v4.0"
          Copy-Item "$net40path\*" -Destination "$net40dest" -Recurse -Force

      - name: Get version from release name
        id: getVersion
        uses: mad9000/actions-find-and-replace-string@5
        with:
          source: "${{ github.event.release.tag_name }}"
          find: "v"
          replace: ""
      
      - name: Normalize the version string into SemVer format (x.x.x)
        id: normalizeVersion
        run: |
          $versionString = "${{ steps.getVersion.outputs.value }}"
          $digits = $versionString.Split(".").Length
          if ($digits -eq 1) { $versionString += ".0.0" }
          elseif ($digits -eq 2) { $versionString += ".0" }
          "VERSION=$($versionString)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      
      - name: Set version in AssemblyInfo.cs
        uses: secondbounce/assemblyinfo-update@v2
        with:
          version: "${{ steps.normalizeVersion.outputs.VERSION }}"
      
      - name: Build solution
        run: msbuild ${{ env.solutionFile }} -t:rebuild -property:Configuration=${{ matrix.configuration }}
      
      - name: Upload the build results as an artifact
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.projectFolder }}/bin/${{ matrix.configuration }}/*
          name: ${{ env.projectName }}.${{ github.event.release.tag_name }}.${{ matrix.configuration }}
      
      - name: Upload build results to release
        uses: svenstaro/upload-release-action@v2
        with:
          file: ${{ env.projectFolder }}/bin/${{ matrix.configuration }}/${{ env.projectFolder }}.exe
      
      - name: Get file size of ${{ env.projectFolder }}.exe
        id: filesize
        run: |
          "FILESIZE=$((Get-Item '${{ env.projectFolder }}/bin/${{ matrix.configuration }}/${{ env.projectFolder }}.exe').length)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      
      - name: Update update.xml
        run: echo '<update version="${{ steps.normalizeVersion.outputs.value }}" name="${{ github.event.release.name }}" size="${{ steps.filesize.outputs.FILESIZE }}" url="https://github.com/OpenFunk-mirror/FunkeySelectorGUI/releases/download/${{ github.event.release.tag_name }}/${{ env.projectFolder }}.exe" />' > update.xml
      
      - name: Push the changes made to update.xml
        run: |
          git config user.name "Github Actions Bot"
          git config user.email "<>"
          git remote set-url origin "ssh://git@codeberg.org/OpenFunk/${{ env.projectName }}.git"

          mkdir -p ~/.ssh
          echo "${{ secrets.CODEBERG_SSH_KEY }}" > ~/.ssh/gh-actions-codeberg-key
          ssk-keygen -y -f ~/.ssh/gh-actions-codeberg-key > ~/.ssh/gh-actions-codeberg-key.pub
          git config --global gpg.format ssh
          git config --global user.signingkey ~/.ssh/gh-actions-codeberg-key.pub

          git add update.xml
          git add "${{ env.projectFolder }}/Properties/AssemblyInfo.cs"
          git commit -S -m "chore(release): ${{ github.event.release.tag_name }}"
          git push origin ${{ github.event.repository.default_branch }}
